name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # llama-cpp-python is intentionally excluded here: it's a heavy
        # C++ build and load_llm() lazily imports it only when a real
        # GGUF model path is configured, which the test suite never does
        # (tests inject a FakeLLM instead). Full local setup still
        # installs it via `pip install -r requirements.txt`.
        run: |
          python -m pip install --upgrade pip
          grep -v '^llama-cpp-python' requirements.txt > /tmp/test-requirements.txt
          pip install -r /tmp/test-requirements.txt
      - name: Run pytest
        run: pytest tests/ -v
